[package]
name = "alaya-apps"
description = "The desktop (compositor) and Alaya's first apps, built with the toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"
test = false
bench = false

[dependencies]
alaya-sys = { path = "../sys" }
alaya-programs = { path = "../programs" }
alaya-ui = { path = "../../ui" }
alaya-crypto = { path = "../../crypto" }

[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
test = false
bench = false

[[bin]]
name = "apps"
path = "src/bin/apps/main.rs"
test = false
bench = false
