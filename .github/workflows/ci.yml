name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso ovmf

      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install && rustup show

      - name: Format
        run: cargo fmt --all --check

      - name: Processor wall
        run: tools/wall-check.sh

      - name: Clippy
        run: |
          cargo clippy --package alaya-kernel --target x86_64-unknown-none -- -D warnings
          cargo clippy --package alaya-abi --package alaya-cap --package alaya-sched --all-targets -- -D warnings
          RUSTFLAGS="-C relocation-model=static" cargo clippy --package alaya-init --package alaya-sys --package alaya-programs \
            --target x86_64-unknown-none --target-dir target/user -- -D warnings
          cargo clippy --package xtask -- -D warnings

      - name: Host tests (capability code, time budgets)
        run: cargo test --package alaya-abi --package alaya-cap --package alaya-sched

      - name: Build image
        run: cargo xtask image

      # Plain emulation (TCG), as on a phone: xAPIC and the APIC one-shot
      # timer, since QEMU cannot emulate the TSC-deadline timer.
      - name: Boot, TCG, BIOS, 1 core
        run: cargo xtask test --image build/alaya-x86_64.iso --accel tcg --cpus 1
      - name: Boot, TCG, BIOS, 2 cores
        run: cargo xtask test --image build/alaya-x86_64.iso --accel tcg --cpus 2
      - name: Boot, TCG, BIOS, 8 cores
        run: cargo xtask test --image build/alaya-x86_64.iso --accel tcg --cpus 8
      - name: Boot, TCG, UEFI, 2 cores
        run: cargo xtask test --image build/alaya-x86_64.iso --accel tcg --cpus 2 --uefi

      # KVM with the host CPU, as on a PC: x2APIC and the TSC-deadline timer.
      - name: Boot, KVM, BIOS, 1, 2 and 8 cores (TSC-deadline timer)
        run: |
          set -o pipefail
          for n in 1 2 8; do
            cargo xtask test --image build/alaya-x86_64.iso --accel kvm --cpus $n | tee boot.log
            grep -q "timer is the TSC-deadline timer" boot.log
          done
      - name: Boot, KVM, UEFI, 8 cores, 4 GiB (1 GiB pages)
        run: cargo xtask test --image build/alaya-x86_64.iso --accel kvm --cpus 8 --uefi --memory 4G

      # Crash on purpose and check the fault reports.
      - name: Fault reports
        run: |
          cargo xtask test --accel tcg --cpus 2 --fault page
          cargo xtask test --accel tcg --cpus 2 --fault stack
          cargo xtask test --accel tcg --cpus 2 --fault invalid-opcode
          cargo xtask test --accel kvm --cpus 4 --fault other-core-page
          cargo xtask test --accel tcg --cpus 2 --fault smap
          cargo xtask test --accel tcg --cpus 2 --fault smep
          cargo xtask test --accel kvm --cpus 2 --fault smap
          cargo xtask test --accel kvm --cpus 2 --fault smep

      # The kernel fuzzer: threads on every core make random system calls
      # on a sandbox; the kernel must not crash and must still work after.
      - name: Kernel fuzzer, TCG, 4 cores, 60 s
        run: cargo xtask test --accel tcg --cpus 4 --fuzz 60
      - name: Kernel fuzzer, KVM, 8 cores, 120 s
        run: cargo xtask test --accel kvm --cpus 8 --fuzz 120

      # Milestone 4: the driver is killed at random for 10 minutes while the
      # test app uses the disk; no wrong answer may reach it.
      - name: Driver chaos, KVM, 8 cores, 10 minutes
        run: cargo xtask test --accel kvm --cpus 8 --long

      - name: Boot with the Termux script
        run: |
          ALAYA_ACCEL=tcg ALAYA_CPUS=2 bash tools/termux/alaya.sh test build/alaya-x86_64.iso
          ALAYA_ACCEL=kvm ALAYA_CPUS=8 bash tools/termux/alaya.sh test build/alaya-x86_64.iso

      - name: Checksum
        run: cd build && sha256sum alaya-x86_64.iso > alaya-x86_64.iso.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: alaya-x86_64
          path: |
            build/alaya-x86_64.iso
            build/alaya-x86_64.iso.sha256
          if-no-files-found: error

  # The same kernel and programs for ARM64 (milestone 4b), on GitHub's ARM
  # machines: QEMU's virt board with a GICv3 interrupt controller, its
  # message translator (ITS) and the SMMUv3 device memory guard.
  arm:
    name: ARM64 build and boot
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-efi-aarch64 xorriso

      - name: Allow KVM (when the machine has it)
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "no KVM here: plain emulation only"
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install && rustup show

      - name: Clippy (ARM64)
        run: |
          cargo clippy --package alaya-kernel --target aarch64-unknown-none-softfloat -- -D warnings
          RUSTFLAGS="-C relocation-model=static" cargo clippy --package alaya-init --package alaya-sys --package alaya-programs \
            --target aarch64-unknown-none --target-dir target/user -- -D warnings

      - name: Build image
        run: cargo xtask image --arch aarch64

      - name: Boot, TCG, 1, 2 and 4 cores
        run: |
          for n in 1 2 4; do
            cargo xtask test --arch aarch64 --image build/alaya-aarch64.iso --accel tcg --cpus $n --timeout 900
          done
      - name: Boot, KVM if available, 8 cores
        run: cargo xtask test --arch aarch64 --image build/alaya-aarch64.iso --cpus 8 --timeout 900

      - name: Fault reports
        run: |
          for kind in page stack invalid-opcode smap smep; do
            cargo xtask test --arch aarch64 --accel tcg --cpus 2 --fault $kind
          done
          cargo xtask test --arch aarch64 --accel tcg --cpus 4 --fault other-core-page

      - name: Kernel fuzzer, 4 cores, 60 s
        run: cargo xtask test --arch aarch64 --accel tcg --cpus 4 --fuzz 60 --timeout 900

      - name: Boot with the Termux script
        run: ALAYA_ARCH=aarch64 ALAYA_ACCEL=tcg ALAYA_CPUS=2 ALAYA_TIMEOUT=900 bash tools/termux/alaya.sh test build/alaya-aarch64.iso

      - name: Checksum
        run: cd build && sha256sum alaya-aarch64.iso > alaya-aarch64.iso.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: alaya-aarch64
          path: |
            build/alaya-aarch64.iso
            build/alaya-aarch64.iso.sha256
          if-no-files-found: error

  # The TLA+ models (formal/): capabilities and revoke, the scheduler with
  # time budgets and lent time, and the driver keeper's crash-and-resend
  # rule. Each has must-fail checks too.
  tla:
    name: TLA+ models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the models with TLC
        run: formal/check.sh

  # Kani proofs of the capability code (cap/src/proofs.rs).
  kani:
    name: Kani proofs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.68.0"
          args: --package alaya-cap

  publish:
    name: Publish image
    needs: [build, arm, tla, kani]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alaya-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: alaya-aarch64

      - name: Nightly release (latest main)
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly alaya-x86_64.iso alaya-x86_64.iso.sha256 \
            alaya-aarch64.iso alaya-aarch64.iso.sha256 \
            --prerelease --target "$GITHUB_SHA" --title "Nightly" \
            --notes "Bootable Alaya images (PC and ARM64) built from main at $GITHUB_SHA. Boot them with tools/termux/alaya.sh or cargo xtask run --image."

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" alaya-x86_64.iso alaya-x86_64.iso.sha256 \
            alaya-aarch64.iso alaya-aarch64.iso.sha256 \
            --title "Alaya $GITHUB_REF_NAME" --generate-notes
