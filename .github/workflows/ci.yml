name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso ovmf

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install && rustup show

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --package alaya-kernel --target x86_64-unknown-none -- -D warnings
          cargo clippy --package xtask -- -D warnings

      - name: Build image
        run: cargo xtask image

      - name: Boot, BIOS, 1 core
        run: cargo xtask test --image build/alaya-x86_64.iso --cpus 1
      - name: Boot, BIOS, 2 cores
        run: cargo xtask test --image build/alaya-x86_64.iso --cpus 2
      - name: Boot, BIOS, 8 cores
        run: cargo xtask test --image build/alaya-x86_64.iso --cpus 8
      - name: Boot, UEFI, 2 cores
        run: cargo xtask test --image build/alaya-x86_64.iso --cpus 2 --uefi
      - name: Boot with the Termux script
        run: ALAYA_CPUS=2 bash tools/termux/alaya.sh test build/alaya-x86_64.iso

      - name: Checksum
        run: cd build && sha256sum alaya-x86_64.iso > alaya-x86_64.iso.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: alaya-x86_64
          path: |
            build/alaya-x86_64.iso
            build/alaya-x86_64.iso.sha256
          if-no-files-found: error

  publish:
    name: Publish image
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alaya-x86_64

      - name: Nightly release (latest main)
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly alaya-x86_64.iso alaya-x86_64.iso.sha256 \
            --prerelease --target "$GITHUB_SHA" --title "Nightly" \
            --notes "Bootable Alaya image built from main at $GITHUB_SHA. Boot it with tools/termux/alaya.sh or cargo xtask run --image."

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" alaya-x86_64.iso alaya-x86_64.iso.sha256 \
            --title "Alaya $GITHUB_REF_NAME" --generate-notes
