[workspace]
resolver = "3"
members = ["abi", "cap", "sched", "kernel", "user/init", "user/sys", "xtask"]
default-members = ["xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/gahitchi/os"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
