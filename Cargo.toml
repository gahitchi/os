[workspace]
resolver = "3"
members = ["abi", "cap", "sched", "store", "kernel", "user/init", "user/programs", "user/sys", "xtask"]
default-members = ["xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/gahitchi/os"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true

# The store's tests run tens of thousands of commits; its scrambling and
# fingerprints are too slow unoptimised.
[profile.dev.package.alaya-store]
opt-level = 2
debug-assertions = true
overflow-checks = true
