\* The front page written without flushing the blocks first: the disk may
\* keep the front page and lose the blocks; then one bad spot on the older
\* page leaves nothing whole to open. Must fail.
CONSTANTS
    Blocks = {1, 2, 3, 4}
    Size = 1
    MaxGen = 4
    Defer = 2
    MaxDamage = 1
    Flush = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK AlwaysOpens NoLostCommit StatesWellFormed
CHECK_DEADLOCK FALSE
